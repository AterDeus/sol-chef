# sol-chef 2.0 — local slice (Sprint 1).
# Host entry: http://localhost:8080  (Caddy :80)
# Apps in ../backend and ../frontend are filled by other agents; this file
# is ready before they exist, but migrate/import/dev servers need those trees.
name: sol-chef

services:
  postgres:
    image: postgres:16
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
      POSTGRES_USER: ${POSTGRES_USER:-solchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solchef-local}
      POSTGRES_DB: ${POSTGRES_DB:-solchef}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sol-chef
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Europe/Moscow
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sol-chef
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app
    init: true
    environment:
      TZ: Europe/Moscow
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-only-not-a-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-solchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solchef-local}
      POSTGRES_DB: ${POSTGRES_DB:-solchef}
      REDIS_URL: redis://redis:6379/0
      V1_DATA_ROOT: ${V1_DATA_ROOT:-/v1-src}
    volumes:
      - ../backend:/app
      - ../../:/v1-src:ro
      - backend_uv_cache:/root/.cache/uv
    # Live code via bind-mount. uv venv stays in the image (/opt/venv), not on the host.
    command:
      [
        "sh",
        "-c",
        "set -eu; if [ -f pyproject.toml ]; then uv sync && uv run python manage.py migrate --noinput && uv run python manage.py collectstatic --noinput && uv run python manage.py import_v1 && uv run python manage.py import_draft --accepted && exec uv run python manage.py runserver 0.0.0.0:8000; else echo 'v2/backend: no pyproject.toml yet — Django app is not in this tree.' >&2; exit 1; fi",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - sol-chef
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    working_dir: /app
    init: true
    environment:
      TZ: Europe/Moscow
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "set -eu; if [ -f package.json ]; then npm install && exec npm run dev -- -H 0.0.0.0 -p 3000; fi; echo 'v2/frontend: no package.json yet — Next app is not in this tree.' >&2; exit 1",
      ]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => { r.resume(); process.exit(r.statusCode ? 0 : 1); }).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - sol-chef
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      TZ: Europe/Moscow
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - sol-chef
    restart: unless-stopped

networks:
  sol-chef:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uv_cache:
  frontend_node_modules:
